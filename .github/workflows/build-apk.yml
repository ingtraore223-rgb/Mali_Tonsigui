name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Générer les fichiers de plateforme Android manquants
        run: |
          flutter create --platforms=android --project-name=mali_tonsigui /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mali-tonsigui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
